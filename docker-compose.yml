version: '3.8'
services:
  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
  postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
  backend:
    build: .
    volumes:
      - ./backend:/app
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    depends_on:
      - mongo
      - postgres
